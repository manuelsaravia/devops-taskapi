services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app           # monta el proyecto para hot-reload
      - db-data:/app/data  # volumen para SQLite (el montaje anterior ocultaría /app/data)
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - PYTHONUNBUFFERED=1

volumes:
  db-data:
