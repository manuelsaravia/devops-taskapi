services:
  api:
    build: .
    container_name: task-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/tasks.db
    volumes:
      - ./app:/app/app          # hot-reload del código
      - db-data:/app/data       # persistencia de SQLite
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  db-data:
