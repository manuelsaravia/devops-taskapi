# 2 réplicas de la API con probes de salud sobre /health
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskapi
  namespace: devops-project
  labels:
    app: taskapi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskapi
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0        # nunca baja de 2 pods listos durante el despliegue
      maxSurge: 1              # levanta 1 pod nuevo antes de retirar uno viejo
  template:
    metadata:
      labels:
        app: taskapi
    spec:
      containers:
        - name: taskapi
          image: jasonmsaravia/devops-taskapi:latest   # el pipeline la reemplaza por :BUILD_NUMBER
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: taskapi-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          startupProbe:              # da hasta 150 s para arrancar; mientras tanto liveness/readiness no actúan
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:             # si falla 3 veces, Kubernetes reinicia el contenedor
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:            # si falla, el pod deja de recibir tráfico (no se reinicia)
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: sqlite-data
              mountPath: /app/data
      volumes:
        - name: sqlite-data
          emptyDir: {}               # vive mientras vive el pod (en producción: PersistentVolumeClaim)
